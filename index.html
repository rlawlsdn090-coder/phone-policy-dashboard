<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=dashboard/">
  <title>알뜰폰 정책 인사이트</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090a;
      --text: #f4f6f8;
      --muted: #a5acb8;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      background: var(--bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    main {
      width: min(520px, calc(100vw - 40px));
      text-align: center;
    }
    p {
      color: var(--muted);
      line-height: 1.7;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>알뜰폰 정책 인사이트</h1>
    <p>대시보드로 이동 중입니다. 자동으로 이동하지 않으면 <a href="dashboard/">여기</a>를 눌러주세요.</p>
  </main>
</body>
</html>
